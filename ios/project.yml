# XcodeGen spec. Generate the project with:
#     brew install xcodegen && cd ios && xcodegen generate
#
# Regenerating is safe: everything meaningful lives here rather than in the
# .xcodeproj, so the generated project is disposable and git-ignored.

name: GetMeHome
options:
  bundleIdPrefix: com.getmehome
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Read from the environment so it survives regeneration. Set it once:
    #     echo 'export DEVELOPMENT_TEAM=ABCDE12345' >> ~/.zshrc
    # Find the ID in Xcode > Settings > Accounts, or at
    # developer.apple.com/account under Membership.
    #
    # Choosing the team in Xcode's Signing tab also works, but the choice
    # lives in the .xcodeproj, which `xcodegen generate` overwrites.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # `minimal` rather than `complete`: the app is written to be
    # main-actor-clean, but strict checking surfaces a lot of noise from SDK
    # conformances (CLLocationManagerDelegate especially). Raise it once the
    # project builds if you want the extra checking.
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  GetMeHome:
    type: application
    platform: iOS
    sources:
      - path: GetMeHome
    info:
      path: GetMeHome/Info.plist
      properties:
        CFBundleDisplayName: GetMeHome
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""

        # The backend this build talks to on first launch. Set it once and
        # every install connects without anyone typing an address:
        #
        #     export GETMEHOME_SERVER_URL=https://getmehome.example.com
        #     xcodegen generate
        #
        # Left empty it falls back to http://localhost:8000, which is right for
        # the simulator and wrong on a device — where localhost is the phone.
        # Settings still overrides it per install.
        GetMeHomeServerURL: ${GETMEHOME_SERVER_URL}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
          - location-services
          - gps

        # Location. The "when in use" string is what appears on the first
        # prompt; "always" is only reached if the user upgrades the grant.
        NSLocationWhenInUseUsageDescription: >-
          GetMeHome uses your location to plan safe routes from where you are
          and to guide you turn by turn.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          GetMeHome keeps guiding you with the screen off so you don't have to
          hold your phone out while walking at night.

        # Required for guidance to continue with the screen locked.
        UIBackgroundModes:
          - location
          - audio

        # Reaching a backend on your own machine needs both of these.
        #
        # iOS 14+ requires explicit permission before an app may talk to
        # anything on the local network, and the prompt only appears if this
        # string is present. Without it the connection fails silently, which
        # looks exactly like the server being down.
        NSLocalNetworkUsageDescription: >-
          GetMeHome connects to the routing server running on your computer to
          plan safe routes.

        # DEVELOPMENT ONLY. The backend is served over plaintext HTTP, which
        # App Transport Security blocks by default. NSAllowsLocalNetworking
        # is not enough on its own: it covers .local names and link-local
        # addresses, not a LAN address like 192.168.1.42.
        #
        # Before shipping: serve the backend over HTTPS and delete
        # NSAllowsArbitraryLoads. Leaving it in a released app means every
        # request the app makes can be read and altered in transit, and App
        # Review will ask about it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getmehome.app
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault

  GetMeHomeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GetMeHomeTests
    dependencies:
      - target: GetMeHome
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getmehome.app.tests

schemes:
  GetMeHome:
    build:
      targets:
        GetMeHome: all
        GetMeHomeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GetMeHomeTests
